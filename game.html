<!DOCTYPE html>

<head>
    <title>Play Starsight</title>
    <link rel="stylesheet" href="game.css" />
    <link rel="icon" href="delver.png" />
</head>

<body>
    <header>
        <h1>Play Starsight</h1>
        <nav>
            <a class="navlink" href="index.html">Log in</a>
            <a class="current navlink" href="game.html">Game</a>
            <a class="navlink" href="scores.html">Scores</a>
        </nav>
    </header>

    <main>
        <section class="sidebar">
            <h2 class="head">Scores summary</h2>
            <h2 class="subhead">(lower scores are better)</h2>
            <div>
                <section>
                    <h3>Most recent score:</h3>
                    <div class="score-display" name="current">
                        <p class="score">22</p>
                        <p class="score-side-text">New personal best!</p>
                    </div>
                    <div class="share">Share:
                        <a href="https://facebook.com/">
                            <img src="images/fb_logo.png" alt="Facebook logo" width=23>
                        </a>
                        <a href="https://x.com/">
                            <img src="images/x_logo.png" alt="X Twitter logo" width=20>
                        </a>
                    </div>
                </section>
                <section>
                    <h3>Personal best score:</h3>
                    <p class="score" name="PR">22</p>
                </section>
                <section>
                    <h3>Overall best score:</h3>
                    <div class="score-display">
                        <p class="score">12</p>
                        <p class="score-side-text">Set by Grond2</p>
                </section>
            </div>

            <div class="best-hits">
                <section>
                    <h3>Personal best hit:</h3>
                    <p class="hit">118</p>
                </section>
                <section>
                    <h3>Overall best hit:</h3>
                    <div class="score-display">
                        <p class="hit">158</p>
                        <p class="hit-side-text">Set by Nolendil</p>
                    </div>
                </section>
            </div>
        </section>

        <section class="window">
            <img src="images/game_window_placeholder.png" alt="Game window" width=880>
        </section>

    </main>
</body>
