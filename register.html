<!DOCTYPE html>

<head>
    <title>Sign up for Starsight account</title>
    <link rel="stylesheet" href="index.css">
    <link rel="icon" href="delver.png">
</head>

<body>
    <header>
        <h1>Sign up for Starsight account</h1>
        <nav>
            <a class="navlink" href="index.html">Log in</a>
            <a class="navlink" href="game.html">Game</a>
            <a class="navlink" href="scores.html">Scores</a>
        </nav>
    </header>

    <main>
        <div>
            <form action="index.html">
                <section>
                    <label for="email">E-mail:</label>
                    <input type="email">
                    </input>
                </section>

                <section>
                    <label for="username">Username:</label>
                    <input type="username">
                    </input>
                </section>

                <section>
                    <label for="password">Password:</label>
                    <input type="password">
                    </input>
                </section>

                <section>
                    <label for="password">Confirm Password:</label>
                    <input type="password">
                    </input>
                </section>

                <button type="submit">Create account</button>

            </form>
        </div>
    </main>

</body>
